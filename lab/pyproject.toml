[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isolyn-lab"
version = "0.0.0"
description = "Offline self-play and calibration lab for IsolynV2.0; trainer is scaffolded."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = [
  "numpy>=2.0",
  "torch>=2.4",
]

[project.scripts]
isolyn-lab = "isolyn_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
