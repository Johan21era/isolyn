name: CI

# Core-hardening roadmap Phase 3a (OPS-04).
# Purpose: make F-02-class drift structurally impossible -- every layer of
# the project's own verification tooling runs on every push and PR, so a
# script/link/interop regression shows up as red CI within minutes instead
# of being rediscovered by an audit months later.
#
# The weekly scheduled job additionally re-runs the bridge fuzzer so
# adversarial-input coverage stays fresh without slowing everyday merges.
#
# The rules gate runs before it: docs/rules/RULEBOOK.md is tier 0, so a rule
# with no assertion, or a declared hole that went missing from Known gaps, is
# a build failure rather than a review note.
#
# The documentation gate runs as its own cheap Linux job on every push and PR.
# It fails on a broken link or docs/ path, a living document without a status
# header, a document missing from the register, a history file without a
# provenance banner, or a superseded figure reappearing in a living document.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  docs-gate:
    name: Documentation gate
    runs-on: ubuntu-latest
    steps:
      # Full history on purpose: the security gate scans every blob ever
      # committed, and a shallow clone (the default) would make that scan
      # silently vacuous while still reporting PASS.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rulebook gate (every rule names real code and a real assertion)
        run: python3 scripts/rules_audit.py

      - name: Documentation consistency (links, paths, status, register, stale figures)
        run: python3 scripts/docs_audit.py

      - name: Security gate (secrets in tree and history, forbidden files, exposed paths, lost guards)
        run: python3 scripts/security_audit.py

  macos-suite:
    name: macOS build + full test suites
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift package build
        run: swift build

      - name: Swift test suite (environment + headless game flow)
        run: swift test

      - name: Offline lab + cloud verifier tests
        run: PYTHONPATH=lab/src python3 -m unittest discover -s lab/tests

      - name: Engine suite (20 executables, 524 checks)
        run: ./scripts/ci/test_engine.sh

      - name: Bridge suite (SmokeTest + SoakTest, 141 checks)
        run: ./scripts/ci/test_bridge.sh

      - name: Rules conformance soak (100 million complete games, nightly)
        if: github.event_name == 'schedule'
        run: ./scripts/ci/rules_soak.sh 100000000
        timeout-minutes: 60

  weekly-fuzz:
    name: Weekly adversarial-input fuzz
    if: github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bridge fuzz (auto-falls back to standalone driver when libFuzzer is absent)
        run: ./scripts/ci/fuzz_bridge.sh 15
